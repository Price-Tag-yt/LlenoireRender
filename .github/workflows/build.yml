name: Build LlenoireRender
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK/NDK/CMake
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK and native ABIs
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libLlenoireRender.so'
          unzip -p app/build/outputs/apk/release/app-release.apk AndroidManifest.xml >/dev/null || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LlenoireRender-1.12.2-release
          path: app/build/outputs/apk/release/app-release.apk
      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: LlenoireRender-native-libs
          path: app/build/intermediates/cmake/release/obj/**/libLlenoireRender.so
